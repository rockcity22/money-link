<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

:root {
  --blue:#087cf0;

  --yellow:#ffd447;
  --bg:#07111f;
  --card:#122239;
  --text:#f0f6ff;
  --muted:#a9bad0;
  --border:#293d56;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

a { color:inherit;text-decoration:none; }

button,input {

}

button {
  cursor:pointer;
}

header {

  z-index:10;
  background:#07111ff5;
  border-bottom:1px solid var(--border);
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo {
  font-size:24px;
  font-weight:900;
}

.logo span { color:var(--green); }

.menu {

  border:1px solid var(--border);
  padding:9px 12px;
  border-radius:10px;
}

nav {
  display:none;
  position:absolute;
  top:65px;

  background:var(--card);
  padding:15px;
  border:1px solid var(--border);
  border-radius:14px;
}

nav.open {
  display:grid;
  gap:12px;
}

nav a:hover { color:var(--green); }

.hero {
  padding:65px 6% 45px;
  background:radial-gradient(ellipse at top left,#087cf044,transparent 65%);
}

.label {
  color:var(--green);
  font-weight:bold;
  letter-spacing:2px;
  font-size:12px;
}

h1 {
  font-size:clamp(38px,8vw,68px);
  line-height:1.08;
  margin:15px 0;
}

h1 span { color:var(--blue); }

p { color:var(--muted); }

.hero p {
  max-width:600px;
  font-size:17px;
}

.search {
  display:flex;
  gap:8px;
  margin-top:25px;
  max-width:650px;
  flex-wrap:wrap;
}

.search input {
  flex:1;
  min-width:180px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}

.btn {
  background:var(--blue);
  color:white;
  border:0;
  border-radius:11px;
  padding:12px 17px;
  font-weight:bold;
}

.btn:hover { filter:brightness(1.15); }

.yellow { color:var(--yellow); }

section { padding:35px 5%; }

.section-title {
  font-size:27px;
  margin-bottom:5px;
}

.categories {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:12px 0 18px;
}

.chip {
  white-space:nowrap;
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:30px;
  background:var(--card);
  color:var(--text);
}

.chip.active {
  background:var(--blue);
  border-color:var(--blue);
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  transition:.2s;
}

.card:hover {
  transform:translateY(-4px);
  border-color:var(--blue);
}

.product-image {
  height:120px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#123d65,#102238);
  font-size:49px;
  position:relative;
}
