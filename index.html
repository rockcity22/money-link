<!-- MONEY-LINK DAILY DISCOVERY -->
<section id="daily-discovery" style="padding:24px 16px;margin:24px auto;max-width:1000px;border-radius:20px;background:linear-gradient(135deg,#092b19,#101820);border:1px solid #26d07c;color:#fff;font-family:Arial,sans-serif;">
  <div style="text-align:center;">
    <p style="color:#26d07c;font-weight:bold;letter-spacing:2px;">MONEY-LINK DISCOVERY</p>
    <h2 style="font-size:28px;margin:8px 0;">Find Your Next Favourite 💚</h2>
    <p style="color:#c7d7ce;">Discover something useful, unexpected, or worth exploring.</p>
  </div>

  <div id="ml-discovery-card" style="background:#101b16;border-radius:16px;padding:22px;margin:20px 0;text-align:center;">
    <div id="ml-discovery-icon" style="font-size:54px;">🎧</div>
    <h3 id="ml-discovery-title">Wireless Headphones</h3>
    <p id="ml-discovery-description" style="color:#c7d7ce;">Explore wireless audio options for music, calls, and everyday listening.</p>
    <a id="ml-discovery-link" href="https://www.google.com/search?tbm=shop&q=wireless+headphones" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:12px 22px;background:#26d07c;color:#06130b;text-decoration:none;font-weight:bold;border-radius:10px;">Explore Finds ↗</a>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
    <button type="button" onclick="mlSurprise()" style="padding:12px 16px;border:0;border-radius:10px;background:#26d07c;color:#06130b;font-weight:bold;">🎲 Surprise Me</button>
    <button type="button" onclick="mlDailyPick()" style="padding:12px 16px;border:1px solid #26d07c;border-radius:10px;background:#13251b;color:#fff;font-weight:bold;">⭐ Daily Pick</button>
    <button type="button" onclick="mlShareFind()" style="padding:12px 16px;border:1px solid #4a90e2;border-radius:10px;background:#13202d;color:#fff;font-weight:bold;">🔗 Share Find</button>
  </div>
  <p id="ml-discovery-message" role="status" style="text-align:center;color:#26d07c;margin-bottom:0;"></p>
</section>

<script>
(function () {
  const mlFinds = [
    {
      icon: "🎧",
      title: "Wireless Headphones",
      description: "Explore wireless audio options for music, calls, and everyday listening.",
      query: "wireless headphones"
    },
    {
      icon: "⌚",
      title: "Smart Watches",
      description: "Discover watches for fitness tracking, notifications, and everyday style.",
      query: "smart watches"
    },
    {
      icon: "🎒",
      title: "Everyday Backpacks",
      description: "Find backpacks for school, work, travel, and carrying your essentials.",
      query: "everyday backpacks"
    },
    {
      icon: "⌨️",
      title: "Computer Accessories",
      description: "Explore keyboards, mice, stands, and accessories for your setup.",
      query: "computer accessories"
    },
    {
      icon: "🏠",
      title: "Smart Home Finds",
      description: "Discover useful lighting, storage, and smart-home accessories.",
      query: "useful home gadgets"
    },
    {
      icon: "🎮",
      title: "Gaming Accessories",
      description: "Explore controllers, headsets, and accessories for gaming.",
      query: "gaming accessories"
    },
    {
      icon: "🔋",
      title: "Phone Accessories",
      description: "Look for chargers, stands, cables, and other phone essentials.",
      query: "phone accessories"
    },
    {
      icon: "🧰",
      title: "Free Digital Tools",
      description: "Discover helpful online tools for creativity, learning, and productivity.",
      query: "free online productivity tools"
    }
  ];

  let mlCurrent = 0;

  function mlShow(index) {
    mlCurrent = index;
    const item = mlFinds[index];

    document.getElementById("ml-discovery-icon").textContent = item.icon;
    document.getElementById("ml-discovery-title").textContent = item.title;
    document.getElementById("ml-discovery-description").textContent = item.description;

    const link = document.getElementById("ml-discovery-link");
    link.href = "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(item.query);
    link.textContent = "Explore Finds ↗";

    document.getElementById("ml-discovery-message").textContent = "Your discovery is ready 💚";
  }

  window.mlSurprise = function () {
    let next = mlCurrent;
    while (mlFinds.length > 1 && next === mlCurrent) {
      next = Math.floor(Math.random() * mlFinds.length);
    }
    mlShow(next);
  };

  window.mlDailyPick = function () {
    const today = new Date();
    const dayNumber = Math.floor(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) / 86400000);
    mlShow(dayNumber % mlFinds.length);
    document.getElementById("ml-discovery-message").textContent = "Today's featured discovery ⭐";
  };

  window.mlShareFind = async function () {
    const item = mlFinds[mlCurrent];
    const shareData = {
      title: "Money-Link Discovery: " + item.title,
      text: item.description,
      url: document.getElementById("ml-discovery-link").href
    };

    try {
      if (navigator.share) {
        await navigator.share(shareData);
      } else if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(shareData.url);
        document.getElementById("ml-discovery-message").textContent = "Link copied! Share it with your friends 💚";
      } else {
        window.prompt("Copy this link to share:", shareData.url);
      }
    } catch (error) {
      if (error.name !== "AbortError") {
        document.getElementById("ml-discovery-message").textContent = "You can share this find using its Explore link.";
      }
    }
  };

  mlDailyPick();
})();
</script>
